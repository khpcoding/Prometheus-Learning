global:
  resolve_timeout: 30s

route:
  receiver: 'null-receiver'
  group_by: ['instance', 'job', 'alertname']
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 5m
  
  routes:
    - match:
        alertgroup: 'blackbox-alerts'
        alertname: 'BlackboxProbeDown'
      receiver: 'blackbox-alerts'
      group_by: ['instance', 'job']
      group_wait: 5s
      group_interval: 30s
      repeat_interval: 5m
      continue: false
    
    - match:
        alertgroup: 'blackbox-alerts'
        alertname: 'BlackboxIcmpProbeFailed'
      receiver: 'null-receiver'
      continue: true
    
    - match:
        alertgroup: 'basic-resource-alerts'
      receiver: 'basic-resource-alerts'
      group_by: ['alertname', 'instance']
      group_wait: 5s
      group_interval: 30s
      repeat_interval: 30m
      continue: true
    
    - match:
        alertgroup: 'db-alerts'
      receiver: 'db-alerts'
      group_by: ['alertname', 'instance']
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 30m
      continue: true

receivers:
  - name: 'null-receiver'
  
  - name: 'blackbox-alerts'
    slack_configs:
      - channel: '#blackbox-alerts'
        send_resolved: true
        api_url: 'https://hooks.slack.com/services/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'
        icon_emoji: ':warning:'
        username: 'Blackbox Monitor'
        title: '{{ if eq .Status "firing" }}🚨 BLACKBOX ALERT{{ else }}✅ BLACKBOX RESOLVED{{ end }}'
        text: |
          {{ if .Alerts }}
          {{ $alert := index .Alerts 0 }}
          *Instance:* `{{ $alert.Labels.instance }}`
          *Job:* {{ $alert.Labels.job }}
          *Status:* {{ .Status | toUpper }}
          *Time:* {{ $alert.StartsAt.Format "15:04:05 UTC" }}
          
          {{ if eq .Status "firing" }}⛔ Service is unreachable{{ else }}✔️ Service restored{{ end }}
          {{ end }}
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
  
  - name: 'basic-resource-alerts'
    slack_configs:
      - channel: '#basic-resource-alerts'
        send_resolved: true
        api_url: 'https://hooks.slack.com/services/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'
        icon_emoji: ':chart_with_upwards_trend:'
        username: 'Resource Monitor'
        title: '{{ if eq .Status "firing" }}{{ if eq (index .Alerts 0).Labels.severity "critical" }}🔥 CRITICAL{{ else }}⚠️ WARNING{{ end }} RESOURCE ALERT{{ else }}✅ RESOURCE OK{{ end }}'
        text: |
          {{ range .Alerts }}
          *Resource:* `{{ .Labels.instance }}`
          *Alert Type:* {{ .Labels.alertname }}
          *Severity:* {{ if eq .Labels.severity "critical" }}🔴 CRITICAL{{ else }}🟡 WARNING{{ end }}
          *Status:* {{ $.Status | toUpper }}
          *Detected At:* {{ .StartsAt.Format "15:04:05 UTC" }}
          
          {{ if .Annotations.message }}
          *Issue:* {{ .Annotations.message }}
          {{ else if .Annotations.summary }}
          *Issue:* {{ .Annotations.summary }}
          {{ else if .Annotations.description }}
          *Issue:* {{ .Annotations.description }}
          {{ end }}
          
          {{ if .Annotations.value }}
          *Current Value:* {{ .Annotations.value }}
          {{ end }}
          
          {{ if eq $.Status "firing" }}
          {{ if eq .Labels.severity "critical" }}🚨 **CRITICAL - IMMEDIATE ATTENTION REQUIRED**{{ else }}⚠️ **Warning - Investigation Recommended**{{ end }}
          {{ else }}
          ✅ **All Systems Normal**
          {{ end }}
          
          ---
          {{ end }}
        color: '{{ if eq .Status "firing" }}{{ if eq (index .Alerts 0).Labels.severity "critical" }}danger{{ else }}warning{{ end }}{{ else }}good{{ end }}'
  
  - name: 'db-alerts'
    slack_configs:
      - channel: '#db-alerts'
        send_resolved: true
        api_url: 'https://hooks.slack.com/services/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'
        icon_emoji: ':database:'
        username: 'Database Monitor'
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: |-
          {{ range .Alerts }}
          • {{ .Labels.instance }} — {{ .Annotations.message }}
          {{ if eq .Status "resolved" }}(now healthy){{ end }}
          {{ end }}
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
